name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::934536640135:role/GitHubActionsDeployRole
          aws-region: ap-southeast-2

      - name: Sync to S3
        run: aws s3 sync dist/ s3://rjwrenovations.co.uk --delete

      - name: Invalidate CloudFront
        if: ${{ vars.CF_DIST_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CF_DIST_ID }} --paths '/*'
